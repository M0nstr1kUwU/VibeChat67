[package]
name = "VibeCodingHAHA"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-dialog = "2"